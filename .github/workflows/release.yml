name: Draft beta release
on:
  push:
    tags:
      - 'v0.3.4'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check tag matches Cargo version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"] == "czi"))')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install Fish
        run: sudo apt-get update && sudo apt-get install -y fish
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: env -u CZI_REAL_DATA_TEST -u CZI_ACTIVITY_AUDIT cargo test --all --locked
      - run: cargo build --release --locked
      - run: env -u CZI_REAL_DATA_TEST -u CZI_ACTIVITY_AUDIT python3 tests/czi_stress.py --mode quick
      - run: env -u CZI_REAL_DATA_TEST -u CZI_ACTIVITY_AUDIT python3 tests/czi_stress.py --mode full
      - name: Package and verify
        run: |
          scripts/package-release.sh
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --draft --prerelease --title "CZI $GITHUB_REF_NAME — First Beta Release" \
            --notes-file docs/release-notes-v0.3.4.md
